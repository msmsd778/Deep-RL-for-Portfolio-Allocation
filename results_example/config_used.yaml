data:
  tickers:
  - SPY
  - IEF
  - GLD
  start: '2005-01-01'
  end: '2024-12-31'
  cache_dir: data
  synthetic: true
  synthetic_seed: 20260420
splits:
  train:
  - '2005-01-01'
  - '2015-12-31'
  val:
  - '2016-01-01'
  - '2019-12-31'
  test_regimes:
    covid_crash:
    - '2020-01-01'
    - '2020-06-30'
    recovery_2020_21:
    - '2020-07-01'
    - '2021-12-31'
    inflation_2022:
    - '2022-01-01'
    - '2022-12-31'
    calm_2023_24:
    - '2023-01-01'
    - '2024-12-31'
  stress_regime:
    gfc:
    - '2007-07-01'
    - '2009-06-30'
env:
  window: 30
  episode_length: 252
  transaction_cost_bps: 5.0
  initial_cash: 1.0
  reward: log_return
  reward_kwargs: {}
  grid_steps: 4
  max_weight: 1.0
  allow_cash: false
  reward_scale: 100.0
train:
  algos:
  - DQN
  - PPO
  seeds:
  - 0
  - 1
  - 2
  total_timesteps: 30000
  eval_freq: 5000
  n_eval_episodes: 3
  device: cpu
  dqn:
    learning_rate: 0.0005
    buffer_size: 100000
    learning_starts: 5000
    batch_size: 128
    tau: 1.0
    gamma: 0.99
    train_freq: 4
    gradient_steps: 1
    target_update_interval: 1000
    exploration_fraction: 0.3
    exploration_initial_eps: 1.0
    exploration_final_eps: 0.05
    policy_kwargs:
      net_arch:
      - 128
      - 128
  ppo:
    learning_rate: 0.0003
    n_steps: 1024
    batch_size: 128
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.005
    vf_coef: 0.5
    max_grad_norm: 0.5
    policy_kwargs:
      net_arch:
        pi:
        - 128
        - 128
        vf:
        - 128
        - 128
results_dir: results_example2
figures_dir: results_example2/figures
